# A release: when a version tag (v2.0.0, …) is pushed, CI runs first (ci.yml, the project's only CI run, D-006); if it
# passes, the desktop installers are built and attached to one GitHub Release. Windows and macOS build in parallel; a
# final job creates the release, so the two never race to create it. A manual run is the release's dry run: CI and
# the installers as workflow artifacts, no release. Signing secrets are described in docs/DESKTOP.md. Without them
# the builds still run, unsigned.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: CI, then the installers as workflow artifacts, no release

# Read-only by default; only the release job may write (it creates the GitHub Release).
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run check:licenses

      - name: Bundle fonts for offline use
        run: npm run fetch:fonts

      # LibRaw's RAW developer: official builds for Windows and Apple silicon, Intel Mac compiled from the source
      # release (each checked by SHA-256; scripts/fetch-libraw.mjs).
      - name: Fetch the RAW developer
        run: npm run fetch:libraw

      - run: npm run build

      - name: Package and sign
        shell: bash
        # Signing variables are exported only when their secret exists: electron-builder treats an empty CSC_LINK
        # as a path (the project folder) and fails, so an unset secret must mean an unset variable.
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then link="$WIN_CSC_LINK"; pass="$WIN_CSC_KEY_PASSWORD"; else link="$MAC_CSC_LINK"; pass="$MAC_CSC_KEY_PASSWORD"; fi
          [ -n "$link" ] && export CSC_LINK="$link"
          [ -n "$pass" ] && export CSC_KEY_PASSWORD="$pass"
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$NOTARY_APPLE_ID" ]; then
            export APPLE_ID="$NOTARY_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
          fi
          npx electron-builder ${{ matrix.platform }} --publish never 2>&1 | tee builder.log
        env:
          # Code signing certificate: base64 .pfx (Windows) or .p12 "Developer ID Application" (macOS).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization.
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Surface the end of the packaging log as an annotation, visible on the run summary page.
      - name: Show packaging error
        if: failure()
        shell: bash
        run: |
          [ -f builder.log ] || exit 0
          msg=$(tail -n 60 builder.log | awk '{ gsub(/\r/, ""); gsub(/%/, "%25"); printf "%s%%0A", $0 }')
          echo "::error title=electron-builder (${{ matrix.os }})::$msg"

      # Installers plus the update manifests (latest*.yml) and block maps the in-app updater reads.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chitthi-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Chitthi Studio ${{ github.ref_name }}
          files: out/*
          body: |
            Chitthi Studio for Windows and macOS.

            **Windows:** download `Chitthi-Studio-Setup-*-x64.exe` and run it. It isn't code-signed yet, so if
            Windows SmartScreen appears, click **More info → Run anyway**.

            **macOS:** download the `.dmg` for your Mac (`arm64` for Apple silicon M1–M4, `x64` for Intel), open it
            and drag Chitthi Studio into Applications. It isn't notarized yet, so if macOS says the app is damaged or
            can't be checked, run `xattr -cr "/Applications/Chitthi Studio.app"` in Terminal once, then open it again.
