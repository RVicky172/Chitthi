# Builds the desktop installers when a version tag (v2.0.0, …) is pushed and attaches them to one GitHub Release.
# Windows and macOS build in parallel; a final job creates the release, so the two never race to create it.
# Signing secrets are described in docs/DESKTOP.md. Without them the builds still run, unsigned.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: builds the installers as workflow artifacts, no release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bundle fonts for offline use
        run: npm run fetch:fonts

      - run: npm run build

      - name: Package and sign
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          # Code signing certificate: base64 .pfx (Windows) or .p12 "Developer ID Application" (macOS).
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Installers plus the update manifests (latest*.yml) and block maps the in-app updater reads.
      - uses: actions/upload-artifact@v4
        with:
          name: chitthi-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Chitthi ${{ github.ref_name }}
          files: out/*
          body: |
            Chitthi desktop app for Windows and macOS.

            **Windows:** download `Chitthi-Setup-*-x64.exe` and run it. It isn't code-signed yet, so if
            Windows SmartScreen appears, click **More info → Run anyway**.

            **macOS:** download the `.dmg` for your Mac (`arm64` for Apple silicon M1–M4, `x64` for Intel), open it
            and drag Chitthi into Applications. It isn't notarized yet, so if macOS says the app is damaged or
            can't be checked, run `xattr -cr /Applications/Chitthi.app` in Terminal once, then open it again.
