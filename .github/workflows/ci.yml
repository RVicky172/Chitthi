# The full check of a release: lint, licences, type check and production build, unit tests, the self-test suite and the
# MCP smoke test (both run Electron, which works on Windows runners without a virtual display), the browser tests, and
# the Docker image. It never runs on its own (D-006: no CI on feature branches or pull requests): the Desktop release
# workflow calls it first, on a version tag or on its manual dry run, and builds the installers only if it passes.
# Day-to-day checks are local (specs/testing-strategy.md). Actions are pinned by commit SHA; Dependabot proposes updates.
name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:licenses
      - run: npm run build
      - run: npm run test:unit
      - run: npm test
      # The MCP smoke test develops a synthetic DNG with LibRaw (scripts/fetch-libraw.mjs).
      - run: npm run fetch:libraw
      - run: npm run test:mcp
      - name: Browser tests and accessibility check
        run: |
          npx playwright install chromium
          npm run test:e2e
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t chitthi:ci .
      - name: Run it the way docker-compose.yml does and check it answers
        run: |
          docker run -d --name chitthi -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true chitthi:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -sI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
      - name: Container log
        if: failure()
        run: docker logs chitthi
