# Chitthi desktop packaging (Windows + macOS). See docs/DESKTOP.md for signing and release setup.
appId: in.chitthi.studio
productName: Chitthi Studio
copyright: Copyright © 2026 RVicky172 and Chitthi contributors (MIT License)

directories:
  output: release
  buildResources: build

# The renderer is already bundled by Vite into dist/; the app only needs that plus the main/preload scripts.
files:
  - dist/**
  - electron/main.cjs
  - electron/ipc.cjs
  - electron/preload.cjs
  - electron/ai.cjs
  - electron/ai-hosts.json
  - electron/mcp.cjs
  - electron/mcp-stdio.cjs
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - '!dist/sw.js'

# The MCP stdio relay runs with Electron in Node mode, outside the archive.
asarUnpack:
  - electron/mcp-stdio.cjs

# Electron fuses, flipped in the packaged binary. runAsNode stays on: the MCP stdio relay (electron/mcp-stdio.cjs) runs
# with ELECTRON_RUN_AS_NODE, because a utilityProcess can't inherit the MCP client's stdin. Everything else is locked.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Unsigned Apple-silicon builds need their ad-hoc signature redone after the fuses change.
  resetAdHocDarwinSignature: true

# Offline card + UI fonts (npm run fetch:fonts), served to the app at app://chitthi/fonts/.
extraResources:
  - from: electron/resources/fonts
    to: fonts

fileAssociations:
  - ext: chitthi
    name: Chitthi design
    description: Chitthi design
    role: Editor
    mimeType: application/x-chitthi

# Auto-updates come from GitHub Releases. Update files are only trusted when the build is signed.
publish:
  provider: github
  owner: RVicky172
  repo: Chitthi
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Signing: set CSC_LINK (path or base64 of the .pfx) and CSC_KEY_PASSWORD, or switch to Azure Trusted
  # Signing by adding `azureSignOptions` here (see docs/DESKTOP.md). Unset = unsigned build. The updater's
  # publisher check is filled in from the certificate, so unsigned builds can still update each other.

nsis:
  license: LICENSE
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: Chitthi-Studio-Setup-${version}-${arch}.${ext}

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip # needed by the auto-updater
      arch: [x64, arm64]
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing: CSC_LINK / CSC_KEY_PASSWORD with a "Developer ID Application" certificate.
  # Notarization runs automatically when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.

dmg:
  artifactName: Chitthi-Studio-${version}-${arch}.${ext}
