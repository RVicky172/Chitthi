# Shared by every location block (nginx drops server-level add_header when a location adds its own).
# HSTS belongs on the proxy that terminates TLS in front of this container (this server speaks plain HTTP on 8080):
#   Strict-Transport-Security: max-age=31536000; includeSubDomains
# See docs/OPERATIONS.md.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# connect-src also lists the AI services that allow browser calls with the user's own key (docs/AI.md), and local
# Ollama / LM Studio. Services without browser support (BFL, Replicate, Ideogram) run in the desktop app only.
# A "custom" OpenAI-compatible service needs its host added here on a self-hosted deployment.
# media-src blob: plays the video editor's clips and music from local files; worker-src blob: lets the video encoder
# (Mediabunny) start its helper workers. 'wasm-unsafe-eval' lets AI masks run their model with WebAssembly (ONNX
# Runtime Web; no JavaScript eval), and huggingface.co with its *.hf.co CDN serves the sky model, downloaded once
# when the user agrees (docs/MEDIA-STUDIO.md). vite preview sends this same policy, so the browser tests run under it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.pexels.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://api.pexels.com https://images.pexels.com https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://openrouter.ai https://api.groq.com https://api.deepseek.com https://api.mistral.ai https://api.together.xyz https://api.stability.ai https://queue.fal.run https://*.fal.media https://huggingface.co https://*.hf.co http://localhost:11434 http://localhost:1234; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
